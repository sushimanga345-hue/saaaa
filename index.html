<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Conforto & Comida — Protótipo 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a1520;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{touch-action:none}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;left:12px;top:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start}.badge,.back{pointer-events:auto;background:#241c29dd;border:1px solid #fff2;border-radius:14px;padding:10px 13px;backdrop-filter:blur(10px)}.back{color:#fff;border:0}
#foods{pointer-events:auto;position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(94vw,850px);display:flex;gap:8px;overflow-x:auto;background:#211a26e8;border:1px solid #fff2;border-radius:20px;padding:10px}.food{flex:0 0 68px;height:68px;border:0;border-radius:16px;background:#fff1;color:#fff;font-size:28px}.food small{display:block;font-size:9px}.hint{position:absolute;left:50%;top:11%;transform:translateX(-50%);background:#241c29dd;border-radius:14px;padding:9px 13px;font-size:12px;opacity:.8;text-align:center}
#toast{position:absolute;left:50%;top:18%;transform:translate(-50%,-10px);background:#fff2f7;color:#482538;border-radius:14px;padding:9px 14px;font-weight:800;opacity:0;transition:.2s}#toast.show{opacity:1;transform:translate(-50%,0)}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#1a1520;z-index:5;font-weight:700}
</style>
</head>
<body>
<div id="app"></div><div id="loading">Carregando modelo 3D…</div>
<div class="ui">
 <div class="top"><div class="badge">Aiko ♡ · Alimentações: <span id="count">0</span></div><button class="back" onclick="location.reload()">Reiniciar</button></div>
 <div class="hint">Passe o dedo pela tela para ela olhar para você<br>Toque numa comida para alimentar</div>
 <div id="toast">Hmmm! 😋</div>
 <div id="foods">
  <button class="food" onclick="feed('🍰','Bolo')">🍰<small>Bolo</small></button>
  <button class="food" onclick="feed('🍕','Pizza')">🍕<small>Pizza</small></button>
  <button class="food" onclick="feed('🍔','Hambúrguer')">🍔<small>Hambúrguer</small></button>
  <button class="food" onclick="feed('🍩','Donut')">🍩<small>Donut</small></button>
  <button class="food" onclick="feed('🍜','Lamen')">🍜<small>Lamen</small></button>
  <button class="food" onclick="feed('🍓','Morango')">🍓<small>Morango</small></button>
  <button class="food" onclick="feed('🍣','Sushi')">🍣<small>Sushi</small></button>
 </div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x6c5967);
scene.fog=new THREE.Fog(0x6c5967,7,15);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);
camera.position.set(0,2.35,8.2); camera.lookAt(0,1.45,0);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; document.getElementById('app').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffe9df,0x342a38,2.2));
const key=new THREE.DirectionalLight(0xffdfc0,3);key.position.set(-3,6,5);key.castShadow=true;scene.add(key);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0x493942,roughness:.9}));
floor.rotation.x=-Math.PI/2;floor.position.y=-1.65;floor.receiveShadow=true;scene.add(floor);
const chair=new THREE.Mesh(new THREE.CapsuleGeometry(2.0,2.2,12,32),new THREE.MeshStandardMaterial({color:0x79586a,roughness:.8}));
chair.scale.set(1,.85,.48);chair.position.set(0,.25,-.55);chair.castShadow=true;chair.receiveShadow=true;scene.add(chair);

let model, baseScale=1, meals=0, targetScale=1;
const loader=new GLTFLoader();
loader.load('./aiko_modelo3d_prototipo.glb',g=>{
 model=g.scene; model.position.set(0,-1.35,0); model.rotation.y=Math.PI; model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});scene.add(model);
 document.getElementById('loading').style.display='none';
},undefined,err=>{document.getElementById('loading').textContent='Erro ao carregar o modelo 3D. Abra os dois arquivos juntos.';console.error(err)});

function feed(emoji,name){
 meals++; document.getElementById('count').textContent=meals;
 targetScale=1+Math.min(meals,100)*.004;
 const t=document.getElementById('toast');t.textContent=emoji+' '+name+'! 😋';t.classList.add('show');
 clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),650);
}
let tx=0,ty=0;
function pointer(x,y){tx=Math.max(-.22,Math.min(.22,(x/innerWidth-.5)*.5));ty=Math.max(-.12,Math.min(.12,(y/innerHeight-.38)*.25))}
addEventListener('pointermove',e=>pointer(e.clientX,e.clientY));addEventListener('pointerdown',e=>pointer(e.clientX,e.clientY));
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){
 requestAnimationFrame(animate);
 if(model){
  model.scale.lerp(new THREE.Vector3(targetScale,targetScale,targetScale),.08);
  model.rotation.y=THREE.MathUtils.lerp(model.rotation.y,Math.PI+tx,.08);
  model.position.y=THREE.MathUtils.lerp(model.position.y,-1.35+ty,.08);
 }
 renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
